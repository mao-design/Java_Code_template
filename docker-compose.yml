services:
  mysql:
    image: mysql:8.4
    container_name: secondhand-market-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: secondhand_market
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - secondhand_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  secondhand_mysql_data:
