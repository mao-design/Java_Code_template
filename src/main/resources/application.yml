server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: secondhand-market
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/secondhand_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      # Redis服务器地址
      host: ${REDIS_HOST:127.0.0.1}
      # Redis端口
      port: ${REDIS_PORT:6379}
      # 密码
      password: ${REDIS_PASSWORD:123456}
      # Redis库
      database: 0
      # 建立连接超时时间
      connect-timeout: 5s
      # 命令执行超时时间
      timeout: 3s
      lettuce:
        pool:
          # 最大连接数
          max-active: 20
          # 最大等待连接时间
          max-wait: 3000ms
          # 最大空闲连接
          max-idle: 10
          # 最小空闲连接
          min-idle: 5

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-before-production-use-at-least-32-bytes}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    refrshTiem: ${JWT_REFRESH_TIME:7}
  upload-dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    com.example.market: info

knife4j:
  enable: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
